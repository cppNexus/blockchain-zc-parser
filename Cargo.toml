[package]
name = "blockchain-zc-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Your Name <you@example.com>"]
description = "Zero-copy, allocation-free parser for Bitcoin/blockchain binary data"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/blockchain-zc-parser"
keywords = ["blockchain", "bitcoin", "parser", "zero-copy", "no-alloc"]
categories = ["parser-implementations", "cryptography::cryptocurrencies"]
readme = "README.md"

[dependencies]
sha2 = { version = "0.10", default-features = false }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
hex-literal = "1.1.0"

[[bench]]
name = "parser_bench"
harness = false

[features]
default = ["std"]
# Enable std-based Display impls
std = []
# Enable serde serialization (requires allocation)
serde = ["dep:serde"]


[dependencies.serde]
version = "1"
optional = true
default-features = false
features = ["derive"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
